name: Build Murka VPN

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  # Public download/update repo; needs the RELEASES_TOKEN secret (fine-grained,
  # Contents: read and write on that repo only). Without it, publishing there is skipped.
  PUBLIC_REPO: Robert-Govard/murka-vpn-releases

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"; tag="${GITHUB_REF_NAME}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"; tag="nightly"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # Files go to a GitHub release, not workflow artifacts: the account's
      # artifact storage quota is too small for APKs and installers.
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$TAG" = nightly ]; then
            gh release delete nightly -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            gh release create nightly -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Мурка VPN nightly ${VERSION}" --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA}"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Мурка VPN ${TAG}" --notes "Build ${GITHUB_RUN_NUMBER}"
          fi
      - name: Prepare public release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping $PUBLIC_REPO"; exit 0; fi
          export GH_TOKEN="$RELEASES_TOKEN"
          if [ "$TAG" = nightly ]; then
            gh release delete nightly -R "$PUBLIC_REPO" --cleanup-tag -y || true
            gh release create nightly -R "$PUBLIC_REPO" --prerelease \
              --title "Мурка VPN nightly ${VERSION}" --notes "Тестовая сборка ${VERSION}"
          else
            gh release create "$TAG" -R "$PUBLIC_REPO" --latest --title "Мурка VPN ${VERSION}" --notes "Мурка VPN ${VERSION}"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v6
        with:
          go-version-file: murka-core/go.mod
          cache-dependency-path: |
            murka-core/go.sum
            olcrtc/go.sum
      - uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
      - name: gomobile
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" "$(go env GOPATH)/bin/gomobile" init
      - name: Xray geo assets
        run: olcbox/scripts/fetch-xray-assets.sh
      - name: Android signing
        working-directory: olcbox
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test and build APKs
        working-directory: olcbox
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          props="-Polcbox.version=${VERSION} -Polcbox.versionCode=${VERSION_CODE}"
          mkdir -p dist
          ./gradlew $props :sharedUI:jvmTest :androidApp:assembleRelease --stacktrace
          cp "$(find androidApp/build/outputs/apk/release -name '*.apk' | head -n1)" "dist/MurkaVPN-${VERSION}-android-universal.apk"
          ./gradlew $props -Polcbox.android.abiFilters=arm64-v8a :androidApp:clean :androidApp:assembleRelease --stacktrace
          cp "$(find androidApp/build/outputs/apk/release -name '*.apk' | head -n1)" "dist/MurkaVPN-${VERSION}-android-arm64-v8a.apk"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" olcbox/dist/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish to public repo
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping $PUBLIC_REPO"; exit 0; fi
          GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" olcbox/dist/* --clobber -R "$PUBLIC_REPO"
          # Stable releases also get version-less names, so download buttons can use
          # releases/latest/download/<name>. Not for nightly: the app reads the
          # nightly version from the file name.
          if [ "$TAG" != nightly ]; then
            mkdir -p stable-names
            for f in olcbox/dist/*; do cp "$f" "stable-names/$(basename "$f" | sed "s/-${VERSION}-/-/")"; done
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" stable-names/* --clobber -R "$PUBLIC_REPO"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v6
        with:
          go-version-file: murka-core/go.mod
          cache-dependency-path: |
            murka-core/go.sum
            olcrtc/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Xray geo assets
        shell: bash
        run: olcbox/scripts/fetch-xray-assets.sh
      - name: Build installers
        working-directory: olcbox
        shell: pwsh
        run: |
          .\gradlew.bat "-Polcbox.version=$env:VERSION" :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi :desktopApp:packageReleasePortableZip --stacktrace
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse desktopApp/build -Include *.exe,*.msi |
            Where-Object { $_.FullName -match 'binaries\\main-release\\(exe|msi)' } |
            ForEach-Object { Copy-Item $_.FullName "dist/MurkaVPN-$env:VERSION-windows-amd64$($_.Extension)" }
          Get-ChildItem -Recurse desktopApp/build -Filter "*-windows-amd64-portable.zip" |
            ForEach-Object { Copy-Item $_.FullName "dist/MurkaVPN-$env:VERSION-windows-amd64-portable.zip" }
          Get-ChildItem dist
      - name: jpackage logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Recurse olcbox/desktopApp/build/compose/logs -Filter *.txt | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" olcbox/dist/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish to public repo
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping $PUBLIC_REPO"; exit 0; fi
          GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" olcbox/dist/* --clobber -R "$PUBLIC_REPO"
          # Stable releases also get version-less names, so download buttons can use
          # releases/latest/download/<name>. Not for nightly: the app reads the
          # nightly version from the file name.
          if [ "$TAG" != nightly ]; then
            mkdir -p stable-names
            for f in olcbox/dist/*; do cp "$f" "stable-names/$(basename "$f" | sed "s/-${VERSION}-/-/")"; done
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" stable-names/* --clobber -R "$PUBLIC_REPO"
          fi

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v6
        with:
          go-version-file: murka-core/go.mod
          cache-dependency-path: |
            murka-core/go.sum
            olcrtc/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Xray geo assets
        run: olcbox/scripts/fetch-xray-assets.sh
      - name: Build DMG
        working-directory: olcbox
        run: |
          ./gradlew -Polcbox.version="${VERSION}" :desktopApp:packageReleaseDmg --stacktrace
          mkdir -p dist
          cp "$(find desktopApp/build/compose/binaries/main-release/dmg -name '*.dmg' | head -n1)" "dist/MurkaVPN-${VERSION}-macos-arm64.dmg"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" olcbox/dist/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish to public repo
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping $PUBLIC_REPO"; exit 0; fi
          GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" olcbox/dist/* --clobber -R "$PUBLIC_REPO"
          # Stable releases also get version-less names, so download buttons can use
          # releases/latest/download/<name>. Not for nightly: the app reads the
          # nightly version from the file name.
          if [ "$TAG" != nightly ]; then
            mkdir -p stable-names
            for f in olcbox/dist/*; do cp "$f" "stable-names/$(basename "$f" | sed "s/-${VERSION}-/-/")"; done
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" stable-names/* --clobber -R "$PUBLIC_REPO"
          fi

  # Unsigned IPA for sideloading (Sideloadly/AltStore re-sign it with the user's Apple ID).
  # Without an Apple Developer account there is no Network Extension: the iOS app runs
  # olcRTC emergency rooms as a local SOCKS proxy only.
  ios:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v6
        with:
          go-version-file: olcrtc/go.mod
          cache-dependency-path: olcrtc/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: gomobile
        working-directory: olcrtc
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build unsigned iOS app
        working-directory: olcbox
        env:
          OLCRTC_REPO: ${{ github.workspace }}/olcrtc
          OLCBOX_VERSION: ${{ needs.version.outputs.version }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios-ipa/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.code }}"
      - name: Package IPA
        working-directory: olcbox
        run: |
          app="build/ios-ipa/DerivedData/Build/Products/Release-iphoneos/iosApp.app"
          test -d "$app"
          rm -rf build/ios-ipa/package dist
          mkdir -p build/ios-ipa/package/Payload dist
          cp -R "$app" build/ios-ipa/package/Payload/
          (cd build/ios-ipa/package && /usr/bin/zip -qry "${GITHUB_WORKSPACE}/olcbox/dist/MurkaVPN-${VERSION}-ios-unsigned.ipa" Payload)
          unzip -t "dist/MurkaVPN-${VERSION}-ios-unsigned.ipa" > /dev/null
          ls -la dist
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" olcbox/dist/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish to public repo
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping $PUBLIC_REPO"; exit 0; fi
          GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" olcbox/dist/* --clobber -R "$PUBLIC_REPO"
          if [ "$TAG" != nightly ]; then
            mkdir -p stable-names
            for f in olcbox/dist/*; do cp "$f" "stable-names/$(basename "$f" | sed "s/-${VERSION}-/-/")"; done
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" stable-names/* --clobber -R "$PUBLIC_REPO"
          fi
