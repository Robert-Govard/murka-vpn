# End-to-end check of a published Windows build on a real Windows machine: the app
# starts in its default mode (system VPN: wintun + tun2socks + Xray) against a
# throwaway Xray server on a separate Linux runner, published through a Cloudflare
# quick tunnel. Keys are random per run; no real subscription is used.
name: Windows end-to-end

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in murka-vpn-releases (latest = newest stable)
        default: latest
      soak_minutes:
        description: How long to keep downloading through the VPN
        default: '3'

permissions:
  contents: write   # the server job hands its endpoint over through a temporary release
  actions: read

env:
  RELEASES_REPO: Robert-Govard/murka-vpn-releases
  WORK: C:\murka-e2e
  ENDPOINT_TAG: e2e-${{ github.run_id }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Start Xray behind a Cloudflare quick tunnel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/srv && cd ~/srv
          curl -sSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x xray cloudflared
          uuid=$(cat /proc/sys/kernel/random/uuid)
          cat > server.json <<EOF
          {"log":{"access":"$HOME/srv/access.log","loglevel":"warning"},
           "inbounds":[{"listen":"127.0.0.1","port":8080,"protocol":"vless",
             "settings":{"clients":[{"id":"$uuid"}],"decryption":"none"},
             "streamSettings":{"network":"ws","wsSettings":{"path":"/murka"}}}],
           "outbounds":[{"protocol":"freedom"}]}
          EOF
          nohup ./xray run -c server.json > xray.out 2>&1 &
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > cf.log 2>&1 &
          host=""
          for i in $(seq 1 60); do
            host=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$host" ] && break; sleep 2
          done
          [ -n "$host" ] || { cat cf.log; exit 1; }
          # Wait until the tunnel answers before handing it over.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/murka" || true)
            [ "$code" != "000" ] && [ "$code" != "530" ] && break; sleep 3
          done
          ip=$(curl -s https://1.1.1.1/cdn-cgi/trace | sed -n 's/^ip=//p')
          printf '{"host":"%s","uuid":"%s","ip":"%s"}\n' "$host" "$uuid" "$ip" > endpoint.json
          echo "server exit IP: $ip, tunnel: $host"
          gh release create "$ENDPOINT_TAG" endpoint.json -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Windows e2e endpoint (temporary)" --notes "Deleted when run $GITHUB_RUN_ID ends."

      - name: Serve until the Windows check ends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 210); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" -q '.jobs[] | select(.name=="e2e") | .status' || true)
            [ "$state" = completed ] && break; sleep 10
          done
          echo "connections through the test server:"
          grep -oE 'accepted (tcp|udp):[^ ]+' ~/srv/access.log | sort | uniq -c | sort -rn | head -20 || true

      - name: Remove the endpoint release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$ENDPOINT_TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true

  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download the build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          if ($tag -eq 'latest') { $tag = gh release view -R $env:RELEASES_REPO --json tagName -q .tagName }
          "Testing $tag"
          New-Item -ItemType Directory -Force $env:WORK | Out-Null
          gh release download $tag -R $env:RELEASES_REPO -p '*windows-amd64-portable.zip' -D "$env:WORK\dl"
          $zip = Get-ChildItem "$env:WORK\dl" -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:WORK\app"

      - name: Seed the app with the test server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = $null
          for ($i = 0; $i -lt 60 -and -not $endpoint; $i++) {
            gh release download $env:ENDPOINT_TAG -R $env:GITHUB_REPOSITORY -p endpoint.json -D "$env:WORK\ep" --clobber 2>$null
            if (Test-Path "$env:WORK\ep\endpoint.json") { $endpoint = Get-Content "$env:WORK\ep\endpoint.json" | ConvertFrom-Json } else { Start-Sleep 5 }
          }
          if (-not $endpoint) { throw 'test server did not publish its endpoint' }
          $endpoint.ip | Set-Content "$env:WORK\server-ip.txt"
          "test server exit IP: $($endpoint.ip)"
          # Same shape as a Remnawave Xray-JSON subscription entry.
          $client = @{
            remarks = 'CI test server'
            log = @{ loglevel = 'warning' }
            dns = @{ servers = @('1.1.1.1') }
            inbounds = @(@{ tag = 'socks'; listen = '127.0.0.1'; port = 10808; protocol = 'socks'; settings = @{ udp = $true } })
            outbounds = @(
              @{ tag = 'proxy'; protocol = 'vless'
                 settings = @{ vnext = @(@{ address = $endpoint.host; port = 443; users = @(@{ id = $endpoint.uuid; encryption = 'none' }) }) }
                 streamSettings = @{ network = 'ws'; security = 'tls'
                   tlsSettings = @{ serverName = $endpoint.host }
                   wsSettings = @{ path = '/murka'; headers = @{ Host = $endpoint.host } } } },
              @{ tag = 'direct'; protocol = 'freedom' },
              @{ tag = 'block'; protocol = 'blackhole' })
            routing = @{ rules = @(@{ type = 'field'; ip = @('geoip:private'); outboundTag = 'direct' }) }
          }
          $clientJson = $client | ConvertTo-Json -Depth 10 -Compress
          $data = Join-Path $env:APPDATA 'MurkaVPN'
          New-Item -ItemType Directory -Force $data | Out-Null
          @{ version = 5; active_location_id = 'xray'
             locations = @(@{ storage_id = 'xray'; name = 'CI test server'; kind = 'xray'; xray_config = $clientJson }) } |
            ConvertTo-Json -Depth 10 | Set-Content "$data\locations_v4.json" -Encoding utf8
          '{"enabled":false}' | Set-Content "$data\telemetry.json" -Encoding utf8
          $direct = curl.exe -s --max-time 15 https://1.1.1.1/cdn-cgi/trace | Select-String '^ip='
          "direct $direct"
          "$direct".Replace('ip=', '') | Set-Content "$env:WORK\direct-ip.txt"

      - name: Connect (system VPN mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:APPDATA 'MurkaVPN\murka.log'
          $app = Start-Process "$env:WORK\app\MurkaVPN\MurkaVPN.exe" -ArgumentList '--olcbox-start-vpn-after-elevation' -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep 3
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Windows TUN connected|TUN connected' -Quiet)) { break }
            if (Get-Process -Id $app.Id -ErrorAction SilentlyContinue) { continue }
            # The app may have relaunched itself elevated: follow the new process.
            $next = Get-Process MurkaVPN -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $next) { throw 'MurkaVPN exited before connecting' }
            $app = $next
          }
          if (-not (Select-String -Path $log -Pattern 'TUN connected' -Quiet)) { Get-Content $log -Tail 80; throw 'VPN did not connect in 120 s' }
          "Connected:"; Select-String -Path $log -Pattern 'connected|Xray|TUN' | Select-Object -Last 10 | ForEach-Object Line
          Get-NetAdapter | Where-Object { $_.InterfaceDescription -match 'Wintun|tun' -or $_.Name -match 'olcbox|murka|tun' } | Format-Table Name, Status, InterfaceDescription

      - name: Traffic goes through the VPN
        shell: pwsh
        run: |
          $failures = @()
          # How soon after the app says "connected" does traffic really flow?
          $watch = [Diagnostics.Stopwatch]::StartNew()
          do {
            $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 5 https://www.google.com/generate_204
            if ($code -eq '204') { break }
            Start-Sleep -Milliseconds 500
          } while ($watch.Elapsed.TotalSeconds -lt 30)
          $warmup = [math]::Round($watch.Elapsed.TotalSeconds, 1)
          "first successful request $warmup s after connect"
          if ($code -ne '204') { $failures += "no traffic within 30 s of connect" }
          elseif ($warmup -gt 3) { $failures += "traffic started only $warmup s after the app reported connected" }
          $serverIp = (Get-Content "$env:WORK\server-ip.txt").Trim()
          $directIp = (Get-Content "$env:WORK\direct-ip.txt").Trim()
          $trace = curl.exe -s --max-time 20 https://1.1.1.1/cdn-cgi/trace
          $exitIp = "$($trace | Select-String '^ip=')".Replace('ip=', '').Trim()
          "exit IP through VPN: '$exitIp' (server $serverIp, direct $directIp)"
          if ($exitIp -ne $serverIp) { $failures += "exit IP '$exitIp' is not the test server's $serverIp" }
          $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 20 https://www.google.com/generate_204
          if ($code -ne '204') { $failures += "google generate_204 returned '$code'" } else { 'google.com: 204 (DNS + HTTPS by name)' }
          $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 20 https://github.com
          if ($code -ne '200') { $failures += "github.com returned '$code'" } else { 'github.com: 200' }
          $resolved = Resolve-DnsName example.com -Type A -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $resolved) { $failures += 'system DNS lookup failed while connected' } else { "system DNS: example.com -> $($resolved.IPAddress)" }
          if ($failures) { $failures | ForEach-Object { "::error::$_" }; exit 1 }

      - name: Stays up under load
        shell: pwsh
        env:
          SOAK: ${{ inputs.soak_minutes }}
        run: |
          $end = (Get-Date).AddMinutes([int]$env:SOAK)
          $ok = 0; $bad = 0; $speeds = @(); $upSpeeds = @()
          $bytes = New-Object byte[] (10MB); (New-Object Random).NextBytes($bytes)
          [IO.File]::WriteAllBytes("$env:WORK\upload.bin", $bytes)
          while ((Get-Date) -lt $end) {
            $out = curl.exe -s -o NUL -w '%{http_code} %{speed_download}' --max-time 30 'https://speed.cloudflare.com/__down?bytes=20000000'
            $parts = "$out".Split(' ')
            if ($LASTEXITCODE -eq 0 -and $parts[0] -eq '200') { $ok++; $speeds += [double]$parts[1] } else { $bad++; "download failed: $out (curl $LASTEXITCODE)" }
            $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 15 https://www.google.com/generate_204
            if ($code -ne '204') { $bad++; "generate_204 failed: $code" } else { $ok++ }
            $up = curl.exe -s -o NUL -w '%{http_code} %{speed_upload}' --max-time 30 --data-binary "@$env:WORK\upload.bin" https://speed.cloudflare.com/__up
            $upParts = "$up".Split(' ')
            if ($LASTEXITCODE -eq 0 -and $upParts[0] -eq '200') { $ok++; $upSpeeds += [double]$upParts[1] } else { $bad++; "upload failed: $up (curl $LASTEXITCODE)" }
          }
          $mbit = if ($speeds) { [math]::Round((($speeds | Measure-Object -Average).Average) * 8 / 1e6, 1) } else { 0 }
          $upMbit = if ($upSpeeds) { [math]::Round((($upSpeeds | Measure-Object -Average).Average) * 8 / 1e6, 1) } else { 0 }
          "requests ok=$ok failed=$bad, average download $mbit Mbit/s, upload $upMbit Mbit/s"
          if (-not (Get-Process MurkaVPN -ErrorAction SilentlyContinue)) { '::error::MurkaVPN died during the soak'; exit 1 }
          if ($bad -gt 0) { "::error::$bad failed requests during the soak"; exit 1 }

      - name: Screenshot and logs
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:WORK\screen.png")
          New-Item -ItemType Directory -Force "$env:WORK\out" | Out-Null
          Copy-Item "$env:WORK\screen.png" "$env:WORK\out" -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:APPDATA 'MurkaVPN\murka.log*') "$env:WORK\out" -ErrorAction SilentlyContinue
          '--- murka.log (tail) ---'
          Get-Content (Join-Path $env:APPDATA 'MurkaVPN\murka.log') -Tail 60 -ErrorAction SilentlyContinue

      - name: Internet survives an app crash
        if: always()
        shell: pwsh
        run: |
          Get-Process MurkaVPN -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 5
          $left = Get-Process | Where-Object { $_.ProcessName -match 'tun2socks|xray-windows' }
          if ($left) { "still running after the app died: $($left.ProcessName -join ', ')" }
          $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 20 https://www.google.com/generate_204
          if ($code -ne '204') { "::error::no internet after the app was killed (got '$code')"; Get-NetRoute -AddressFamily IPv4 | Format-Table -AutoSize; exit 1 }
          'internet works after the app was killed'

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-e2e
          path: C:\murka-e2e\out
          retention-days: 3
